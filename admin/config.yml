backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "Produkty"
    folder: "content/products"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    
    # Tutaj są nowe funkcje grupowania i filtrowania
    view_groups:
      - label: "Grupuj wg kategorii"
        field: "category"
    view_filters:
      - label: "Tylko Naszyjniki"
        field: "category"
        pattern: "Naszyjnik"
      - label: "Tylko Bransolety"
        field: "category"
        pattern: "Bransoleta"

    # Tutaj są definicje wszystkich pól (tylko raz!)
    fields:
      - label: "Nazwa produktu"
        name: "title"
        widget: "string"
      - label: "Cena"
        name: "price"
        widget: "string"
      - label: "Opis"
        name: "body"
        widget: "markdown"
      - label: "Zdjęcie"
        name: "image"
        widget: "image"
      - label: "Kategoria"
        name: "category"
        widget: "select"
        options: ["Naszyjnik", "Bransoleta", "Kolczyki", "Pierścionek"]