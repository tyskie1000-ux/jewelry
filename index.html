<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morana Art - Ekskluzywna Biżuteria</title>
    <!-- Łączymy z plikiem style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SEKCJA NASZYJNIKI -->
    <section class="category-section">
        <div class="category-header">
            <a href="#" class="see-more">Zobacz więcej >></a>
            <h2 class="category-title">NASZYJNIKI</h2>
        </div>
        
        <!-- Tu JavaScript wstrzyknie naszyjniki -->
        <div id="naszyjniki-grid" class="products-grid">
            <p>Ładowanie naszyjników...</p>
        </div>
    </section>

    <!-- SKRYPT DO POBIERANIA DANYCH -->
    <script>
    async function fetchNaszyjniki() {
        const repoOwner = "tyskie1000-ux"; 
        const repoName = "jewelry"; 
        const folderPath = "content/products";
        const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`;

        try {
            const response = await fetch(apiUrl);
            const files = await response.json();
            const grid = document.getElementById('naszyjniki-grid');
            grid.innerHTML = ''; // Czyścimy napis "Ładowanie..."

            for (const file of files) {
                if (file.name.endsWith('.json')) {
                    const res = await fetch(file.download_url);
                    const product = await res.json();

                    // Pokazujemy tylko te, które mają kategorię "Naszyjniki"
                    if (product.category === "Naszyjniki") {
                        const cardHTML = `
                            <div class="product-card">
                                <div class="image-container">
                                    <div class="wishlist-icon">♡</div>
                                    <img src="${product.image}" alt="${product.title}">
                                </div>
                                <div class="product-info">
                                    <span class="product-category-label">NOWOŚĆ</span>
                                    <h3 class="product-name">${product.title}</h3>
                                    <div class="product-price">${product.price} zł</div>
                                </div>
                            </div>
                        `;
                        grid.innerHTML += cardHTML;
                    }
                }
            }
        } catch (error) {
            console.error("Błąd:", error);
            document.getElementById('naszyjniki-grid').innerHTML = '<p>Nie udało się załadować produktów.</p>';
        }
    }

    // Uruchamiamy funkcję
    fetchNaszyjniki();
    </script>
</body>
</html>
