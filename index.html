<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morana Art - Ekskluzywna Biżuteria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <header class="site-header">
        <img src="images/uploads/logo.jpg" alt="Morana Art Logo" class="site-logo">
        <h1 class="site-title">MORANA ART JEWELRY1</h1>
    </header>

    <nav class="main-nav">
        <div class="nav-container">
            <ul class="nav-links">
                <li><a href="#sec-Bransoletki">Bransoletki</a></li>
                <li><a href="#sec-Kolczyki">Kolczyki</a></li>
                <li><a href="#sec-Naszyjniki">Naszyjniki</a></li>
            </ul>

            <div class="permanent-menu">
                <div class="hamburger-icon" onclick="toggleExtraMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                    <ul class="extra-dropdown" id="extraMenu">
                        <li><a href="omnie.html">O mnie</a></li>
                        <li><a href="kontakt.html">Kontakt</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- SLIDER -->
    <div class="swiper main-slider">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="images/uploads/slider1.jpg" alt="Kolekcja 1"></div>
            <div class="swiper-slide"><img src="images/uploads/slider2.jpg" alt="Kolekcja 2"></div>
            <div class="swiper-slide"><img src="images/uploads/slider3.jpg" alt="Kolekcja 3"></div>
        </div>
        <div class="swiper-pagination"></div>
    </div>

    <!-- SEKCJA BRANSOLETKI -->
    <section id="sec-Bransoletki" class="category-section">
        <div class="category-header">
            <a href="category.html?cat=Bransoletki" class="see-more">Zobacz więcej</a>
            <h2 class="category-title">BRANSOLETKI</h2>
        </div>
        <div class="swiper products-swiper">
            <div id="grid-Bransoletki" class="swiper-wrapper">
                <!-- Produkty -->
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </section>

    <!-- SEKCJA KOLCZYKI -->
    <section id="sec-Kolczyki" class="category-section">
        <div class="category-header">
            <a href="category.html?cat=Kolczyki" class="see-more">Zobacz więcej</a>
            <h2 class="category-title">KOLCZYKI</h2>
        </div>
        <div class="swiper products-swiper">
            <div id="grid-Kolczyki" class="swiper-wrapper">
                <!-- Produkty -->
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </section>

    <!-- SEKCJA NASZYJNIKI -->
    <section id="sec-Naszyjniki" class="category-section">
        <div class="category-header">
            <a href="category.html?cat=Naszyjniki" class="see-more">Zobacz więcej</a>
            <h2 class="category-title">NASZYJNIKI</h2>
        </div>
        <div class="swiper products-swiper">
            <div id="grid-Naszyjniki" class="swiper-wrapper">
                <!-- Produkty -->
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </section>

    <script>
async function loadAllProducts() {
    const repoOwner = "tyskie1000-ux"; 
    const repoName = "jewelry"; 
    const folderPath = "content/products";
    const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`;

    try {
        const response = await fetch(apiUrl);
        const files = await response.json();

        const categories = ["Bransoletki", "Kolczyki", "Naszyjniki"];
        categories.forEach(cat => {
            const el = document.getElementById(`grid-${cat}`);
            if (el) el.innerHTML = '';
        });

        // TO JEST TWOJA PĘTLA FOR
        for (const file of files) {
            if (file.name.endsWith('.json')) {
                    const res = await fetch(file.download_url + '?t=' + Date.now());
                    const product = await res.json();

                    const isNew = product.is_new === true || product.is_new === "true";
                    let cleanPrice = product.price.toString().toLowerCase().replace('zł', '').trim();

                    const cardHTML = `
                        <div class="swiper-slide">
                            <a href="product.html?id=${file.name}" class="product-card" style="text-decoration: none;">
                                <div class="image-container">
                                    <img src="${product.image}" alt="${product.title}">
                                </div>
                                <div class="product-info">
                                    ${isNew ? '<span class="product-category-label">NOWOŚĆ</span>' : ''}
                                    <h3 class="product-name">${product.title}</h3>
                                    <div class="product-price">${cleanPrice} zł</div>
                                </div>
                            </a>
                        </div>
                    `;

                const targetGrid = document.getElementById(`grid-${product.category}`);
                if (targetGrid) {
                    targetGrid.innerHTML += cardHTML;
                }
            }
        }

        categories.forEach(cat => {
            const el = document.getElementById(`grid-${cat}`);
            if (el && el.innerHTML === '') {
                el.innerHTML = '<p style="color: #666; font-style: italic; text-align:center; width:100%;">Obecnie brak produktów w tej kategorii.</p>';
            }
        });

        document.querySelectorAll('.products-swiper').forEach(slider => {
            new Swiper(slider, {
                slidesPerView: 1,
                spaceBetween: 15,
                navigation: {
                    nextEl: slider.querySelector('.swiper-button-next'),
                    prevEl: slider.querySelector('.swiper-button-prev'),
                },
                breakpoints: {
                    640: { slidesPerView: 2.5 },
                    1024: { slidesPerView: 4 },
                    1440: { slidesPerView: 5 }
                }
            });
        });

    } catch (error) {
        console.error("Błąd ładowania:", error);
    }
}

loadAllProducts();
</script>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  function toggleExtraMenu() {
      const extra = document.getElementById('extraMenu');
      extra.classList.toggle('active');
  }

  const swiper = new Swiper('.main-slider', {
    loop: true,
    autoplay: {
      delay: 5000,
      disableOnInteraction: false,
    },
    pagination: {
      el: '.swiper-pagination',
      clickable: true,
    },
    grabCursor: true,
  });
</script>
</body>
</html>
