<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morana Art - Ekskluzywna Biżuteria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <!-- SLIDER -->
    <div class="swiper main-slider">
        <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="images/uploads/slider1.jpg" alt="Kolekcja 1"></div>
            <div class="swiper-slide"><img src="images/uploads/slider2.jpg" alt="Kolekcja 2"></div>
            <div class="swiper-slide"><img src="images/uploads/slider3.jpg" alt="Kolekcja 3"></div>
        </div>
        <div class="swiper-pagination"></div>
    </div>

    <!-- SEKCJA NASZYJNIKI -->
    <section class="category-section">
        <div class="category-header">
            <a href="#" class="see-more">Zobacz więcej >></a>
            <h2 class="category-title">NASZYJNIKI</h2>
        </div>
        <div id="grid-Naszyjniki" class="products-grid">
            <p>Ładowanie naszyjników...</p>
        </div>
    </section>

    <!-- SEKCJA BRANSOLETKI -->
    <section class="category-section">
        <div class="category-header">
            <a href="#" class="see-more">Zobacz więcej >></a>
            <h2 class="category-title">BRANSOLETKI</h2>
        </div>
        <div id="grid-Bransoletki" class="products-grid">
            <p>Ładowanie bransoletek...</p>
        </div>
    </section>

    <!-- SEKCJA KOLCZYKI -->
    <section class="category-section">
        <div class="category-header">
            <a href="#" class="see-more">Zobacz więcej >></a>
            <h2 class="category-title">KOLCZYKI</h2>
        </div>
        <div id="grid-Kolczyki" class="products-grid">
            <p>Ładowanie kolczyków...</p>
        </div>
    </section>

    <script>
async function loadAllProducts() {
    const repoOwner = "tyskie1000-ux"; 
    const repoName = "jewelry"; 
    const folderPath = "content/products";
    const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`;

    try {
        const response = await fetch(apiUrl);
        const files = await response.json();

        const categories = ["Naszyjniki", "Bransoletki", "Kolczyki"];
        categories.forEach(cat => {
            const el = document.getElementById(`grid-${cat}`);
            if (el) el.innerHTML = '';
        });

        // TO JEST TWOJA PĘTLA FOR
        for (const file of files) {
            if (file.name.endsWith('.json')) {
                    const res = await fetch(file.download_url + '?t=' + Date.now());
                    const product = await res.json();

                    const isNew = product.is_new === true || product.is_new === "true";
                    let cleanPrice = product.price.toString().toLowerCase().replace('zł', '').trim();

                    const cardHTML = `
                        <a href="product.html?id=${file.name}" class="product-card" style="text-decoration: none;">
                            <div class="image-container">
                                <div class="wishlist-icon">♡</div>
                                <img src="${product.image}" alt="${product.title}">
                            </div>
                            <div class="product-info">
                                ${isNew ? '<span class="product-category-label">NOWOŚĆ</span>' : ''}
                                <h3 class="product-name">${product.title}</h3>
                                <div class="product-price">${cleanPrice} zł</div>
                            </div>
                        </a>
                    `;

                const targetGrid = document.getElementById(`grid-${product.category}`);
                if (targetGrid) {
                    targetGrid.innerHTML += cardHTML;
                }
            }
        }

        categories.forEach(cat => {
            const el = document.getElementById(`grid-${cat}`);
            if (el && el.innerHTML === '') {
                el.innerHTML = '<p style="color: #666; font-style: italic; text-align:center; width:100%;">Obecnie brak produktów w tej kategorii.</p>';
            }
        });

    } catch (error) {
        console.error("Błąd ładowania:", error);
    }
}

loadAllProducts();
</script>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  const swiper = new Swiper('.main-slider', {
    loop: true,
    autoplay: {
      delay: 5000,
      disableOnInteraction: false,
    },
    pagination: {
      el: '.swiper-pagination',
      clickable: true,
    },
    grabCursor: true,
  });
</script>
</body>
</html>
